# Run tests on push/PR (dry-run + verify)
name: tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
# IN-1333 D: a new push to a PR cancels that PR's run still in flight (its result would be stale), freeing the
# runner. Pushes to main always finish: each one is a deploy candidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test,verify]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
